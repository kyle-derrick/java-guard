name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Run compatibility runner unit tests
        run: python -m unittest discover -s compat-tests/tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-reports-ubuntu-jdk8
          path: target/surefire-reports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: java-guard-jdk8
          path: target/java-guard-*.jar
          if-no-files-found: error

  windows-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress clean verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-reports-windows-jdk8
          path: target/surefire-reports/
          if-no-files-found: warn

  runtime:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21']
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v8
        with:
          name: java-guard-jdk8
          path: dist
      - name: Test release JAR on JDK ${{ matrix.java }}
        shell: bash
        run: |
          JAR="$(find dist -maxdepth 1 -name 'java-guard-*.jar' -print -quit)"
          test -n "$JAR"
          java -jar "$JAR" --help | grep -q 'usage: java-guard'

  launcher:
    name: Launcher test, build, and SBOM
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Create minimal runtime classes fixture
        working-directory: jg-launcher
        shell: bash
        run: |
          mkdir -p build/ext
          # runtime.classes is a sequence of length-prefixed class records.
          # An empty stream is the deterministic minimal valid fixture.
          : > build/ext/runtime.classes
      - name: Check Rust formatting
        working-directory: jg-launcher
        run: cargo fmt --all -- --check
      - name: Run strict Clippy (default features)
        working-directory: jg-launcher
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run strict Clippy (all features)
        working-directory: jg-launcher
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run launcher tests
        working-directory: jg-launcher
        run: cargo test --locked
      - name: Build launcher release binary
        working-directory: jg-launcher
        run: cargo build --release --locked
      - name: Install CycloneDX generator
        working-directory: jg-launcher
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Generate launcher CycloneDX SBOM
        working-directory: jg-launcher
        run: cargo cyclonedx --format json --spec-version 1.5 --override-filename jg-launcher-sbom
      - name: Upload launcher CycloneDX SBOM
        uses: actions/upload-artifact@v7
        with:
          name: jg-launcher-sbom
          path: jg-launcher/jg-launcher-sbom.json
          if-no-files-found: error
