name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Verify tag is on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          TAG_SHA="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$TAG_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME ($TAG_SHA) is not an ancestor of origin/main" >&2
            exit 1
          }

      - name: Validate release versions
        id: version
        shell: bash
        run: |
          POM_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          CARGO_VERSION="$(grep -m 1 '^version = ' jg-launcher/Cargo.toml | cut -d '"' -f 2)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ "$POM_VERSION" != "$TAG_VERSION" ]]; then
            echo "POM version $POM_VERSION does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "$CARGO_VERSION" != "$TAG_VERSION" ]]; then
            echo "Launcher version $CARGO_VERSION does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

          echo "version=$POM_VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=target/java-guard-$POM_VERSION.jar" >> "$GITHUB_OUTPUT"
          echo "maven_sbom=target/java-guard-maven-sbom.json" >> "$GITHUB_OUTPUT"
          echo "launcher_sbom=target/jg-launcher-cargo-sbom.json" >> "$GITHUB_OUTPUT"

      - name: Build release package
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Name Maven SBOM
        run: mv target/java-guard-sbom.json "${{ steps.version.outputs.maven_sbom }}"

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate launcher Cargo SBOM
        run: |
          cargo cyclonedx \
            --manifest-path jg-launcher/Cargo.toml \
            --format json \
            --target all \
            --override-filename ../target/jg-launcher-cargo-sbom

      - name: Smoke-test executable JAR
        run: java -jar "${{ steps.version.outputs.jar }}" --help

      - name: Generate SHA-256 checksum
        shell: bash
        run: sha256sum "${{ steps.version.outputs.jar }}" > "${{ steps.version.outputs.jar }}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-guard-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.version.outputs.jar }}
            ${{ steps.version.outputs.jar }}.sha256
            ${{ steps.version.outputs.maven_sbom }}
            ${{ steps.version.outputs.launcher_sbom }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.version.outputs.jar }}" \
            "${{ steps.version.outputs.jar }}.sha256" \
            "${{ steps.version.outputs.maven_sbom }}" \
            "${{ steps.version.outputs.launcher_sbom }}" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
