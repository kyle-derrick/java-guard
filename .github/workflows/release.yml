name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Verify tag is on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          TAG_SHA="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$TAG_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME ($TAG_SHA) is not an ancestor of origin/main" >&2
            exit 1
          }

      - name: Validate release versions
        id: version
        shell: bash
        run: |
          POM_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          CARGO_VERSION="$(grep -m 1 '^version = ' jg-launcher/Cargo.toml | cut -d '"' -f 2)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ "$POM_VERSION" != "$TAG_VERSION" ]]; then
            echo "POM version $POM_VERSION does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "$CARGO_VERSION" != "$TAG_VERSION" ]]; then
            echo "Launcher version $CARGO_VERSION does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

          echo "version=$POM_VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=target/release-assets/java-guard-$POM_VERSION.jar" >> "$GITHUB_OUTPUT"
          echo "maven_sbom=target/release-assets/java-guard-maven-sbom.json" >> "$GITHUB_OUTPUT"
          echo "launcher_sbom=target/release-assets/jg-launcher-cargo-sbom.json" >> "$GITHUB_OUTPUT"
          echo "license=target/release-assets/LICENSE" >> "$GITHUB_OUTPUT"

      - name: Build release package with JDK 8
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Stage immutable Java release inputs
        shell: bash
        run: |
          mkdir -p target/release-assets
          cp "target/java-guard-${{ steps.version.outputs.version }}.jar" "${{ steps.version.outputs.jar }}"
          cp target/java-guard-sbom.json "${{ steps.version.outputs.maven_sbom }}"
          cp LICENSE "${{ steps.version.outputs.license }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 25 compatibility runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run native JDK 25 Spring compatibility gate
        shell: bash
        run: |
          python compat-tests/run.py \
            --java-guard-jar "${{ steps.version.outputs.jar }}" \
            --jdk-home "$JAVA_HOME" \
            --tool-jdk-home "$JAVA_HOME" \
            --fixture jdk25 \
            --expected-class-major 69 \
            --work-dir "$RUNNER_TEMP/java-guard-compat-jdk25" \
            --report-dir "compat-tests/reports/release-jdk25"

      - name: Upload JDK 25 compatibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-compat-ubuntu-jdk25
          path: compat-tests/reports/release-jdk25/
          if-no-files-found: warn

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate launcher Cargo SBOM
        run: |
          cd jg-launcher
          cargo cyclonedx \
            --format json \
            --target all \
            --override-filename jg-launcher-cargo-sbom
          mv jg-launcher-cargo-sbom.json ../target/release-assets/jg-launcher-cargo-sbom.json

      - name: Validate release assets
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib

          expected = {
              pathlib.Path("${{ steps.version.outputs.maven_sbom }}"): ("java-guard", "${{ steps.version.outputs.version }}"),
              pathlib.Path("${{ steps.version.outputs.launcher_sbom }}"): ("jg-launcher", "${{ steps.version.outputs.version }}"),
          }
          for path, (name, version) in expected.items():
              document = json.loads(path.read_text(encoding="utf-8"))
              if document.get("bomFormat") != "CycloneDX":
                  raise SystemExit(f"{path} is not a CycloneDX SBOM")
              component = document.get("metadata", {}).get("component", {})
              if component.get("name") != name or component.get("version") != version:
                  raise SystemExit(f"{path} component mismatch: {component!r}")
              licenses = component.get("licenses", [])
              expressions = {item.get("expression") for item in licenses if isinstance(item, dict)}
              identifiers = {
                  item.get("license", {}).get("id")
                  for item in licenses if isinstance(item, dict) and isinstance(item.get("license"), dict)
              }
              if "Apache-2.0" not in expressions | identifiers:
                  raise SystemExit(f"{path} does not declare Apache-2.0: {licenses!r}")
          PY

      - name: Smoke-test executable JAR
        run: java -jar "${{ steps.version.outputs.jar }}" --help

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          cd target/release-assets
          sha256sum "java-guard-${{ steps.version.outputs.version }}.jar" \
            > "java-guard-${{ steps.version.outputs.version }}.jar.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: java-guard-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.version.outputs.jar }}
            ${{ steps.version.outputs.jar }}.sha256
            ${{ steps.version.outputs.maven_sbom }}
            ${{ steps.version.outputs.launcher_sbom }}
            ${{ steps.version.outputs.license }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.version.outputs.jar }}" \
            "${{ steps.version.outputs.jar }}.sha256" \
            "${{ steps.version.outputs.maven_sbom }}" \
            "${{ steps.version.outputs.launcher_sbom }}" \
            "${{ steps.version.outputs.license }}" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
